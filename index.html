<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Suivi Anomalies Terrain</title>

<!-- Icône d'app / installation écran d'accueil -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#161a20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Anomalies">
<script>
  (function(){
    try{
      if(localStorage.getItem('anomalies_theme') === 'light'){
        document.documentElement.setAttribute('data-theme','light');
        var m = document.querySelector('meta[name="theme-color"]');
        if(m) m.setAttribute('content', '#F4F5F7');
      }
    }catch(e){}
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161a20;
    --bg-alt:#11151a;
    --panel:#1e242c;
    --panel-2:#252c35;
    --line:#333c48;
    --text:#EDEFF3;
    --text-dim:#8f99a8;
    --text-faint:#5c6673;
    --accent:#5B9BD8;
    --accent-dim:#3a4a5a;
    --red:#E5484D;
    --red-bg:rgba(229,72,77,0.14);
    --amber:#F2A93C;
    --amber-bg:rgba(242,169,60,0.14);
    --green:#3DBE79;
    --green-bg:rgba(61,190,121,0.14);
    --violet:#A78BFA;
    --violet-bg:rgba(167,139,250,0.16);
    --radius:12px;
    --shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  [data-theme="light"]{
    --bg:#F4F5F7;
    --bg-alt:#FFFFFF;
    --panel:#FFFFFF;
    --panel-2:#EDEFF2;
    --line:#DBDFE5;
    --text:#1B2129;
    --text-dim:#5C6673;
    --text-faint:#848E9C;
    --accent:#2E6DA4;
    --accent-dim:#DCE9F5;
    --red:#C82D33;
    --red-bg:rgba(200,45,51,0.10);
    --amber:#9C6300;
    --amber-bg:rgba(156,99,0,0.12);
    --green:#188053;
    --green-bg:rgba(24,128,83,0.10);
    --violet:#6D48D6;
    --violet-bg:rgba(109,72,214,0.12);
    --shadow:0 8px 24px rgba(20,25,35,0.12);
  }
  *,*::before,*::after{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.45;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Oswald',sans-serif; margin:0; letter-spacing:0.02em;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; font-size:15px;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  a{color:var(--accent);}

  #app{max-width:640px; margin:0 auto; padding-bottom:96px; min-height:100vh; background:var(--bg); position:relative;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(18px + env(safe-area-inset-top)) 16px 14px; background:linear-gradient(180deg, var(--bg-alt), var(--bg));
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-icon{
    width:34px; height:34px; border-radius:9px; background:#E2001A;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    box-shadow:0 2px 6px rgba(226,0,26,0.35);
  }
  .brand h1{font-size:19px; font-weight:600; text-transform:uppercase; color:var(--text);}
  .brand-sub{margin:1px 0 0; font-size:11.5px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; letter-spacing:0.03em;}
  .header-actions{display:flex; align-items:center; gap:6px;}
  .icon-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:16px; cursor:pointer;
  }
  .icon-btn:active{background:var(--panel-2);}

  .sync-row{
    display:flex; align-items:center; gap:6px; padding:0 16px 12px;
    font-size:11.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace;
  }
  .sync-dot{width:6px;height:6px;border-radius:50%; background:var(--green); flex-shrink:0;}
  .sync-dot.offline{background:var(--amber);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}
  .sync-dot.live{animation:pulse 2.4s ease-in-out infinite;}

  /* ---------- Stats ---------- */
  .stats-bar{display:flex; gap:8px; padding:0 16px 14px;}
  .stat-pill{
    flex:1; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:9px 8px; text-align:center;
  }
  .stat-pill .num{font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:600; display:block;}
  .stat-pill .lbl{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em;}
  .stat-pill.red .num{color:var(--red);}
  .stat-pill.amber .num{color:var(--amber);}
  .stat-pill.green .num{color:var(--green);}

  /* ---------- Controls ---------- */
  .controls{padding:0 16px 12px;}
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    border-radius:999px; padding:9px 14px; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .chip[data-active="true"]{background:var(--accent); border-color:var(--accent); color:#0d1116; font-weight:600;}
  .search-wrap{position:relative;}
  #searchInput{
    width:100%; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    color:var(--text); padding:10px 12px; outline-offset:2px;
  }
  #searchInput::placeholder{color:var(--text-faint);}

  /* ---------- Category rail ---------- */
  .rail{padding:4px 16px 12px; border-left:2px solid var(--line); margin:0 16px 0 22px;}
  .category{background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
  .category[data-worst="red"]{border-left-color:var(--red);}
  .category[data-worst="amber"]{border-left-color:var(--amber);}
  .category[data-worst="green"]{border-left-color:var(--green);}
  .category-header{
    display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;
  }
  .category-header .cat-label{
    font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:14.5px; letter-spacing:0.03em; flex:1;
  }
  .cat-counts{display:flex; gap:5px; align-items:center;}
  .mini-count{font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:2px 6px; border-radius:6px; min-width:20px; text-align:center;}
  .mini-count.red{background:var(--red-bg); color:var(--red);}
  .mini-count.amber{background:var(--amber-bg); color:var(--amber);}
  .mini-count.green{background:var(--green-bg); color:var(--green);}
  .mini-count.zero{opacity:0.35;}
  .chevron{color:var(--text-faint); transition:transform 0.15s ease; font-size:12px;}
  .category[data-open="true"] .chevron{transform:rotate(90deg);}
  .category-body{display:none; padding:0 12px 12px;}
  .category[data-open="true"] .category-body{display:block;}

  .anomaly-card{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer;
  }
  .anomaly-card:active{background:#2c333d;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:5px;}
  .identifiant{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13.5px; color:var(--text);}
  .priority-chip{font-size:10.5px; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap;}
  .priority-chip.p-faible{background:transparent; border:1px solid var(--line); color:var(--text-dim);}
  .priority-chip.p-moyenne{background:var(--accent-dim); color:var(--accent);}
  .priority-chip.p-elevee{background:var(--violet-bg); color:var(--violet);}
  .card-meta{font-size:12px; color:var(--text-dim); font-family:'IBM Plex Mono',monospace; margin-bottom:6px;}
  .card-desc{font-size:13.5px; color:var(--text); margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-bottom{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .status-pill{
    display:flex; align-items:center; gap:5px; font-size:12.5px; cursor:pointer;
    padding:8px 13px 8px 10px; border-radius:999px; background:var(--panel); border:1px solid var(--line);
  }
  .status-pill:active{background:var(--panel-2); transform:scale(0.97);}
  .status-pill .cycle-hint{color:var(--text-faint); font-size:11px; margin-left:1px;}
  .status-pill .dot{width:8px; height:8px; border-radius:50%;}
  .status-pill.non-traite .dot{background:var(--red);}
  .status-pill.en-cours .dot{background:var(--amber);}
  .status-pill.traite .dot{background:var(--green);}
  .card-by{font-size:11px; color:var(--text-faint);}

  .add-anomaly-btn{
    width:100%; background:transparent; border:1px dashed var(--line); color:var(--accent);
    border-radius:10px; padding:10px; font-size:13.5px; cursor:pointer; margin-top:2px;
  }
  .add-anomaly-btn:active{background:var(--panel-2);}

  .empty-state{padding:36px 16px; text-align:center; color:var(--text-dim);}
  .empty-state .big{font-size:32px; margin-bottom:6px;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; bottom:22px; right:calc(50% - 320px + 22px);
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:#0d1116;
    border:none; font-size:28px; box-shadow:var(--shadow); cursor:pointer; z-index:30;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  @media (max-width:684px){ .fab{ right:22px; } }
  .fab:active{transform:scale(0.94);}

  /* ---------- Modal / sheet ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(8,10,13,0.6); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    touch-action:none;
  }
  .sheet{
    background:var(--bg-alt); width:100%; max-width:640px; max-height:92vh;
    border-radius:18px 18px 0 0; border:1px solid var(--line); border-bottom:none;
    position:relative; display:flex; flex-direction:column; overflow:hidden;
    touch-action:none;
  }
  .sheet-close{
    position:absolute; top:12px; right:12px; width:38px; height:38px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line); color:var(--text-dim);
    font-size:15px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5;
  }
  .sheet-close:active{background:var(--panel-2);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:12px auto 2px; flex-shrink:0;}
  .sheet-scroll{
    flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
    padding:12px 18px calc(28px + env(safe-area-inset-bottom));
    touch-action:pan-y;
  }
  .sheet h2{font-size:17px; margin-bottom:2px;}
  .sheet .sheet-sub{font-size:12.5px; color:var(--text-dim); margin-bottom:16px; font-family:'IBM Plex Mono',monospace;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.02em;}
  .field input, .field select, .field textarea{
    width:100%; max-width:100%; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:9px;
    color:var(--text); padding:10px 11px; line-height:20px;
  }
  .field input:not([type="checkbox"]):not([type="radio"]){ min-height:41px; }
  .field select{ min-height:41px; }
  .field input[type="date"]{
    -webkit-appearance:none; appearance:none;
  }
  .field textarea{resize:vertical; min-height:64px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1; min-width:0;}
  @media (max-width:400px){
    .field-row{flex-direction:column; gap:13px;}
  }
  .section-divider{border:none; border-top:1px solid var(--line); margin:16px 0 14px;}
  .section-divider-label{font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; margin:-10px 0 12px;}
  .sheet-actions{
    flex-shrink:0; display:flex; gap:10px;
    background:var(--bg-alt);
    padding:16px 18px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
  }
  .btn{flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:14.5px; font-weight:600; cursor:pointer;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#0d1116;}
  .btn.danger{background:transparent; border-color:var(--red); color:var(--red); flex:0 0 auto; padding:12px 16px;}
  .btn:active{opacity:0.85;}

  .picker-list{display:flex; flex-direction:column; gap:8px;}
  .picker-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line);
    border-radius:10px; padding:12px 14px; cursor:pointer; font-family:'Oswald',sans-serif;
    text-transform:uppercase; font-size:14px; letter-spacing:0.02em;
  }
  .picker-item:active{background:var(--panel-2);}
  .picker-item span.pcode{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); text-transform:none;}

  .menu-list{display:flex; flex-direction:column; gap:6px;}
  .menu-section{margin-bottom:18px;}
  .menu-section:last-of-type{margin-bottom:6px;}
  .menu-section-title{
    font-size:11.5px; color:var(--text-faint); text-transform:uppercase;
    letter-spacing:0.06em; margin:0 0 7px 3px; font-weight:600;
  }
  .menu-item{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 14px;
    text-align:left; color:var(--text); font-size:14.5px; cursor:pointer;
  }
  .menu-item:active{background:var(--panel-2);}
  .app-version{
    text-align:center; font-size:11.5px; color:var(--text-faint);
    font-family:'IBM Plex Mono',monospace; margin:16px 0 0;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 18px; border-radius:999px; font-size:13.5px; box-shadow:var(--shadow); z-index:80;
  }

  .photo-actions{display:flex; gap:8px; margin-bottom:10px;}
  .photo-actions .btn{padding:10px 8px; font-size:13px; flex:1;}
  .photo-actions .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .photo-gallery{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:10px; min-height:72px;}
  .photo-thumb{position:relative; flex-shrink:0; width:72px; height:72px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--panel);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in;}
  .photo-thumb .remove-photo{
    position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%;
    background:rgba(15,17,20,0.8); color:#fff; border:none; font-size:11px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-thumb.loading{display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:9.5px; text-align:center; padding:4px;}
  .photo-hint{color:var(--text-faint); font-size:12px; align-self:center;}
  .lightbox{position:fixed; inset:0; background:rgba(6,8,10,0.95); z-index:90; overflow:hidden; touch-action:none;}
  .lightbox-close{
    position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px; z-index:6;
    width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.14); border:none;
    color:#fff; font-size:17px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .lightbox-track{display:flex; width:100%; height:100%;}
  .lightbox-slide{
    flex:0 0 100%; width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    overflow:hidden; touch-action:none;
  }
  .lightbox-slide img{
    max-width:100%; max-height:100%; touch-action:none; user-select:none; -webkit-user-drag:none;
    transform-origin:center center; will-change:transform;
  }
  .lightbox-dots{
    position:absolute; bottom:calc(18px + env(safe-area-inset-bottom)); left:0; right:0;
    display:flex; justify-content:center; gap:6px; z-index:6;
  }
  .lightbox-dots .dot{width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.35);}
  .lightbox-dots .dot.active{background:#fff;}

  .tuto-icon{font-size:54px; text-align:center; margin:10px 0 16px; line-height:1;}
  .tuto-title{text-align:center; margin-bottom:10px;}
  .tuto-text{font-size:14.5px; line-height:1.6; color:var(--text); text-align:center; margin:0 2px 20px;}
  .tuto-dots{display:flex; justify-content:center; gap:6px; margin-bottom:6px;}
  .tuto-dots .dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
  .tuto-dots .dot.active{background:var(--accent);}

  .confirm-overlay{align-items:center; z-index:100;}
  .confirm-card{
    background:var(--bg-alt); border:1px solid var(--line); border-radius:16px;
    padding:22px 20px; width:calc(100% - 56px); max-width:320px; box-shadow:var(--shadow);
  }
  .confirm-message{font-size:14.5px; color:var(--text); margin:0 0 18px; line-height:1.5;}
  .confirm-actions{display:flex; gap:10px;}
  .btn.danger-solid{background:var(--red); border-color:var(--red); color:#fff; flex:1;}

  .new-badge{
    background:var(--accent); color:#0d1116; font-size:9.5px; font-weight:700;
    padding:2px 6px; border-radius:5px; letter-spacing:0.04em; margin-left:6px; vertical-align:middle;
  }
  .loading-screen{display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; color:var(--text-dim); gap:10px;}
  .spinner{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <line x1="3.5" y1="7.5" x2="20.5" y2="7.5" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
          <line x1="3.5" y1="16.5" x2="20.5" y2="16.5" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
          <line x1="6.5" y1="5.3" x2="6.5" y2="18.7" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
          <line x1="10.5" y1="5.3" x2="10.5" y2="18.7" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
          <line x1="14.5" y1="5.3" x2="14.5" y2="18.7" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
          <line x1="18.5" y1="5.3" x2="18.5" y2="18.7" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Suivi Anomalies</h1>
        <p class="brand-sub" id="brandSub">RÉSEAU TERRAIN</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="historyBtn" title="Historique">🗂️</button>
      <button class="icon-btn" id="refreshBtn" title="Actualiser">⟳</button>
      <button class="icon-btn" id="menuBtn" title="Menu">⋮</button>
    </div>
  </div>
  <div class="sync-row">
    <span class="sync-dot live" id="syncDot"></span>
    <span id="syncLabel">Synchronisation…</span>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="controls">
    <div class="chips" id="filterChips"></div>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Rechercher : équipement, PK, description…">
    </div>
  </div>

  <main class="rail" id="categoryList">

  function escapeHtml(str){

  let savedScrollY = 0;

  function confirmDialog(message, okLabel, okClass){

          </div>

      document.body.appendChild(wrap);
      function cleanup(result){ wrap.remove(); resolve(result); }
      wrap.addEventListener('click', e=>{ if(e.target===wrap) cleanup(false); });

  function fmtDate(iso){

  // ---------------- Storage (Firestore = partagé, localStorage = profil perso) ----------------
  function loadProfile(){

      const raw = localStorage.getItem('anomalies_profile');

  function saveProfile(name){

  function getTheme(){
    try{ return localStorage.getItem('anomalies_theme') === 'light' ? 'light' : 'dark'; }catch(e){ return 'dark'; }
  }
  function setTheme(theme){
    const t = theme === 'light' ? 'light' : 'dark';
    if(t === 'light') document.documentElement.setAttribute('data-theme','light');
    else document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('anomalies_theme', t); }catch(e){ /* ignore */ }
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if(metaTheme) metaTheme.setAttribute('content', t === 'light' ? '#F4F5F7' : '#161a20');
  }
  function hasSeenTutorial(){
    try{ return localStorage.getItem('anomalies_tutorial_seen') === 'true'; }catch(e){ return false; }
  }
  function markTutorialSeen(){
    try{ localStorage.setItem('anomalies_tutorial_seen', 'true'); }catch(e){ /* ignore */ }
  }

  // Hors connexion, Firestore enregistre localement immédiatement mais ne confirme
  // qu'au retour du réseau. On ne bloque donc pas l'utilisateur sur cette confirmation :
  // au-delà d'un court délai, l'écriture est considérée comme prise en compte.
  function writeWithoutWaitingServer(promise, timeoutMs){
    return new Promise((resolve)=>{
      let settled = false;
      const timer = setTimeout(()=>{
        if(!settled){ settled = true; resolve(true); }
      }, timeoutMs || 1200);
      promise.then(()=>{
        if(!settled){ settled = true; clearTimeout(timer); resolve(true); }
      }).catch((e)=>{
        console.error(e);
        if(!settled){ settled = true; clearTimeout(timer); resolve(false); }
      });
    });
  }

  function saveAnomalyDoc(item){
    try{ return writeWithoutWaitingServer(setDoc(doc(db, ANOMALIES_COL, item.id), item)); }
    catch(e){ console.error(e); return Promise.resolve(false); }
  }
  function deleteAnomalyDoc(id){
    try{ return writeWithoutWaitingServer(deleteDoc(doc(db, ANOMALIES_COL, id))); }
    catch(e){ console.error(e); return Promise.resolve(false); }
  }
  function savePhotoDoc(id, dataUrl){
    try{ return writeWithoutWaitingServer(setDoc(doc(db, PHOTOS_COL, id), {data: dataUrl}), 2500); }
    catch(e){ console.error(e); return Promise.resolve(false); }
  }
  function deletePhotoDoc(id){
    try{ return writeWithoutWaitingServer(deleteDoc(doc(db, PHOTOS_COL, id))); }
    catch(e){ return Promise.resolve(false); }
  }
  async function getPhotoDoc(id){
    // Hors connexion, on lit directement la copie locale pour éviter toute attente.
    try{
      const cached = await getDocFromCache(doc(db, PHOTOS_COL, id));
      if(cached.exists()) return cached.data().data || null;
    }catch(e){ /* pas encore en cache : on tente le réseau ci-dessous */ }
    if(!navigator.onLine) return null;
    try{
      const snap = await getDoc(doc(db, PHOTOS_COL, id));
      return snap.exists() ? (snap.data().data || null) : null;
    }catch(e){ return null; }
  }

  // ---- Disponibilité des photos hors connexion ----
  // Les photos déjà ouvertes restent consultables hors ligne. Pour que ce soit
  // aussi le cas de celles jamais consultées, on les récupère discrètement en
  // arrière-plan tant qu'il y a du réseau, sans bloquer l'utilisation de l'app.
  const photoPrefetchDone = new Set();
  let prefetchRunning = false;

  async function isPhotoCached(id){
    try{ await getDocFromCache(doc(db, PHOTOS_COL, id)); return true; }
    catch(e){ return false; }
  }

  async function prefetchPhotos(){
    if(prefetchRunning || !navigator.onLine) return;
    prefetchRunning = true;
    try{
      const ids = [];
      // Uniquement les anomalies actives : l'historique n'est pas préchargé.
      activeAnomalies().forEach(a => getPhotoIds(a).forEach(pid => {
        if(!photoPrefetchDone.has(pid)) ids.push(pid);
      }));
      for(const pid of ids){
        if(!navigator.onLine) break;
        photoPrefetchDone.add(pid);
        if(await isPhotoCached(pid)) continue;
        try{ await getDoc(doc(db, PHOTOS_COL, pid)); }catch(e){ photoPrefetchDone.delete(pid); }
        // Pause entre chaque photo pour ne pas gêner l'usage ni saturer le réseau.
        await new Promise(r => setTimeout(r, 400));
      }
    }finally{
      prefetchRunning = false;
    }
  }

  // ---------------- Notifications push ----------------
  function pushSupported(){
    return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  }
  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(base64);
    const out = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function subKeyId(endpoint){
    // Identifiant stable et court dérivé de l'adresse d'abonnement.
    let h = 0;
    for(let i=0;i<endpoint.length;i++){ h = (h*31 + endpoint.charCodeAt(i)) | 0; }
    return 'sub' + Math.abs(h).toString(36) + '_' + endpoint.slice(-12).replace(/[^a-zA-Z0-9]/g,'');
  }
  function notificationsEnabled(){
    try{ return localStorage.getItem('anomalies_push') === 'on'; }catch(e){ return false; }
  }
  async function enableNotifications(){
    if(!pushSupported()){
      showToast("Notifications non disponibles sur cet appareil");
      return false;
    }
    if(PUSH_ENDPOINT.startsWith('REMPLACER')){
      showToast("Service de notifications non configuré");
      return false;
    }
    try{
      const perm = await Notification.requestPermission();
      if(perm !== 'granted'){
        showToast("Notifications refusées — vous pouvez les autoriser dans les réglages");
        return false;
      }
      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if(!sub){
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      const json = sub.toJSON();
      await setDoc(doc(db, PUSHSUBS_COL, subKeyId(json.endpoint)), {
        endpoint: json.endpoint,
        owner: profile.name || '',
        createdAt: new Date().toISOString(),
      });
      try{ localStorage.setItem('anomalies_push', 'on'); }catch(e){}
      showToast('Notifications activées ✓');
      return true;
    }catch(e){
      console.error(e);
      showToast("Activation impossible — réessayez");
      return false;
    }
  }
  async function disableNotifications(){
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if(sub){
        const json = sub.toJSON();
        try{ await deleteDoc(doc(db, PUSHSUBS_COL, subKeyId(json.endpoint))); }catch(e){}
        await sub.unsubscribe();
      }
    }catch(e){ /* ignore */ }
    try{ localStorage.setItem('anomalies_push', 'off'); }catch(e){}
    showToast('Notifications désactivées');
  }
  // Prévient les autres appareils qu'une anomalie vient d'être créée.
  // Sans réseau, la demande est mise en attente et repartira automatiquement.
  const PENDING_PUSH_KEY = 'anomalies_push_pending';

  function markPushPending(){
    try{ localStorage.setItem(PENDING_PUSH_KEY, profile.name || ''); }catch(e){}
  }
  function clearPushPending(){
    try{ localStorage.removeItem(PENDING_PUSH_KEY); }catch(e){}
  }
  function hasPushPending(){
    try{ return localStorage.getItem(PENDING_PUSH_KEY) !== null; }catch(e){ return false; }
  }

  function sendPushRequest(author){
    return fetch(PUSH_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ author: author || '' }),
    });
  }

  function triggerPushNotification(){
    if(PUSH_ENDPOINT.startsWith('REMPLACER')) return;
    if(!navigator.onLine){
      markPushPending();
      return;
    }
    try{
      sendPushRequest(profile.name)
        .then((res)=>{ if(!res.ok) markPushPending(); })
        .catch(()=>{ markPushPending(); });
    }catch(e){ markPushPending(); }
  }

  // Au retour du réseau : on laisse d'abord l'anomalie se synchroniser,
  // puis on envoie la notification en attente.
  function flushPendingPush(){
    if(PUSH_ENDPOINT.startsWith('REMPLACER')) return;
    if(!hasPushPending() || !navigator.onLine) return;
    let author = '';
    try{ author = localStorage.getItem(PENDING_PUSH_KEY) || ''; }catch(e){}
    setTimeout(()=>{
      if(!navigator.onLine) return;
      sendPushRequest(author)
        .then((res)=>{ if(res.ok) clearPushPending(); })
        .catch(()=>{ /* on réessaiera à la prochaine occasion */ });
    }, 5000);
  }

  const APP_VERSION = '2.2';
  const MAX_PHOTOS = 4;
  // Renvoie la liste des identifiants de photos d'une anomalie.
  // Compatible avec les anciennes anomalies (une seule photo, stockée sous la clé = id de l'anomalie).
  function getPhotoIds(anomaly){
    if(anomaly.photoIds && anomaly.photoIds.length) return anomaly.photoIds.slice();
    if(anomaly.hasPhoto) return [anomaly.id];
    return [];
  }

  const STATUS_CYCLE = {'Non traité':'En cours', 'En cours':'Traité', 'Traité':'Non traité'};
  async function cycleStatus(id){
    const item = anomalies.find(a=>a.id===id);
    if(!item) return;
    haptic(12);
    const nextStatus = STATUS_CYCLE[item.statut] || 'Non traité';
    const updated = {
      ...item,
      statut: nextStatus,
      updatedAt: new Date().toISOString(),
      updatedBy: profile.name || 'Anonyme',
    };
    if(nextStatus === 'Traité'){
      if(!updated.dateTraitement) updated.dateTraitement = new Date().toISOString().slice(0,10);
      if(!updated.traitePar) updated.traitePar = profile.name || 'Anonyme';
      updated.treatedAt = new Date().toISOString();
    }else{
      // Repasse en cours : l'archivage automatique ne doit plus s'appliquer.
      updated.treatedAt = null;
      updated.archived = false;
    }
    const ok = await saveAnomalyDoc(updated);
    if(ok) haptic(18);
    showToast(ok ? `Statut : ${nextStatus}` : "Échec de la mise à jour du statut");
  }

  function nextIdentifiant(catId){
    const cat = CATEGORIES.find(c=>c.id===catId);
    let max = 0;
    anomalies.forEach(a=>{
      if(a.category===catId){
        const m = /-(\d+)$/.exec(a.identifiant||'');
        if(m){ const n = parseInt(m[1],10); if(n>max) max=n; }
      }
    });
    return `${cat.prefix}-${String(max+1).padStart(3,'0')}`;
  }

  function findPotentialDuplicate(catId, voie, equipement){
    const v = (voie||'').trim().toLowerCase();
    const e = (equipement||'').trim().toLowerCase();
    if(!v || !e) return null;
    return anomalies.find(a=>
      a.category===catId &&
      a.statut!=='Traité' &&
      (a.voie||'').trim().toLowerCase()===v &&
      (a.equipement||'').trim().toLowerCase()===e
    ) || null;
  }

  // ---------------- Rendering ----------------
  const ARCHIVE_DELAY_MS = 24 * 60 * 60 * 1000;
  // Une anomalie part à l'historique soit manuellement, soit automatiquement
  // 24 h après avoir été passée en "Traité".
  function isArchived(a){
    if(a.archived === true) return true;
    if(a.archived === false) return false; // ressortie manuellement de l'historique
    if(a.statut !== 'Traité') return false;
    const ref = a.treatedAt || a.updatedAt;
    if(!ref) return false;
    return (Date.now() - new Date(ref).getTime()) > ARCHIVE_DELAY_MS;
  }
  function activeAnomalies(){ return anomalies.filter(a => !isArchived(a)); }
  function archivedAnomalies(){ return anomalies.filter(isArchived); }
  function viewAnomalies(){ return currentView === 'history' ? archivedAnomalies() : activeAnomalies(); }

  function computeCatStats(catId){
    const items = viewAnomalies().filter(a=>a.category===catId);
    const c = {'Non traité':0,'En cours':0,'Traité':0};
    items.forEach(a=>{ if(c[a.statut]!==undefined) c[a.statut]++; });
    return {total:items.length, ...c};
  }
  function worstColor(stats){
    if(stats['Non traité']>0) return 'red';
    if(stats['En cours']>0) return 'amber';
    if(stats['Traité']>0) return 'green';
    return '';
  }

  function matchesFilters(a){
    if(activeFilter==='mine'){
      const name = profile.name;
      if(!name) return false;
      if(a.createdBy!==name && a.updatedBy!==name && a.traitePar!==name) return false;
    }else if(activeFilter==='new'){
      if(!newBatchIds.has(a.id)) return false;
    }else if(activeFilter!=='all' && a.statut!==FILTER_MAP[activeFilter]) return false;
    if(searchTerm){
      const q = searchTerm.toLowerCase();
      const hay = [a.identifiant,a.voie,a.pk,a.equipement,a.description,a.commentaire,a.traitePar].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }

  function renderStats(){
    const bar = $('#statsBar');
    if(currentView === 'history'){
      const total = archivedAnomalies().length;
      bar.innerHTML = `
        <div class="stat-pill green" style="flex:1"><span class="num">${total}</span><span class="lbl">Anomalies archivées</span></div>
      `;
      return;
    }
    const c = {'Non traité':0,'En cours':0,'Traité':0};
    activeAnomalies().forEach(a=>{ if(c[a.statut]!==undefined) c[a.statut]++; });
    bar.innerHTML = `
      <div class="stat-pill red"><span class="num">${c['Non traité']}</span><span class="lbl">Non traité</span></div>
      <div class="stat-pill amber"><span class="num">${c['En cours']}</span><span class="lbl">En cours</span></div>
      <div class="stat-pill green"><span class="num">${c['Traité']}</span><span class="lbl">Traité</span></div>
    `;
  }

  function renderChips(){
    const wrap = $('#filterChips');
    if(currentView === 'history'){
      wrap.innerHTML = '';
      wrap.style.display = 'none';
      return;
    }
    wrap.style.display = '';
    const defs = [['all','Toutes'],['non-traite','Non traité'],['en-cours','En cours'],['traite','Traité'],['mine','Les miennes']];
    if(newBatchIds.size > 0){
      defs.push(['new', `🆕 Nouvelles (${newBatchIds.size})`]);
    }
    wrap.innerHTML = defs.map(([k,label])=>
      `<button class="chip" data-filter="${k}" data-active="${activeFilter===k}">${label}</button>`
    ).join('');
  }

  function renderCategories(){
    const root = $('#categoryList');
    const source = viewAnomalies();
    const filterActive = currentView === 'history'
      ? searchTerm.trim()!==''
      : (activeFilter!=='all' || searchTerm.trim()!=='');
    let html = '';
    let anyVisible = false;

    CATEGORIES.forEach(cat=>{
      const all = source.filter(a=>a.category===cat.id);
      const visibleItems = all.filter(matchesFilters);
      if(currentView === 'history' && all.length === 0) return;
      if(filterActive && visibleItems.length===0) return;
      anyVisible = true;
      const stats = computeCatStats(cat.id);
      const worst = worstColor(stats);
      const isOpen = filterActive ? true : expanded.has(cat.id);

      let cardsHtml = '';
      if(isOpen){
        if(visibleItems.length===0){
          cardsHtml = `<div class="empty-state" style="padding:18px 4px;"><div>Aucune anomalie ${filterActive?'ne correspond au filtre':'enregistrée'} pour l'instant.</div></div>`;
        }else{
          cardsHtml = visibleItems.slice().sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||'')).map(a=>{
            const isNew = a.createdAt && (Date.now() - new Date(a.createdAt).getTime()) < 24*60*60*1000;
            return `
            <div class="anomaly-card" data-cat="${cat.id}" data-id="${a.id}">
              <div class="card-top">

                <span class="priority-chip ${priorityClass(a.priorite)}">${escapeHtml(a.priorite)}</span>
              </div>
              <div class="card-meta">${escapeHtml(a.voie||'—')} · PK ${escapeHtml(a.pk||'—')} · ${escapeHtml(a.equipement||'—')}</div>

                ${currentView === 'history'
                  ? `<span class="status-pill traite" style="cursor:default"><span class="dot"></span>Archivée</span>`

                <span class="card-by">${a.updatedBy ? 'Modifié par '+escapeHtml(a.updatedBy) : ''}</span>
              </div>
            </div>
          `;}).join('');

        if(currentView !== 'history'){
          cardsHtml += `<button class="add-anomaly-btn" data-cat="${cat.id}">+ Ajouter une anomalie · ${escapeHtml(cat.label)}</button>`;
        }
      }

      html += `
        <div class="category" data-cat="${cat.id}" data-open="${isOpen}" data-worst="${currentView === 'history' ? '' : worst}">
          <div class="category-header" data-cat="${cat.id}">
            <span class="cat-label">${escapeHtml(cat.label)}</span>
            <div class="cat-counts">
              ${currentView === 'history'
                ? `<span class="mini-count green">${all.length}</span>`
                : `<span class="mini-count red ${stats['Non traité']===0?'zero':''}">${stats['Non traité']}</span>
                   <span class="mini-count amber ${stats['En cours']===0?'zero':''}">${stats['En cours']}</span>
                   <span class="mini-count green ${stats['Traité']===0?'zero':''}">${stats['Traité']}</span>`}
            </div>
            <span class="chevron">▶</span>
          </div>
          <div class="category-body">${cardsHtml}</div>
        </div>
      `;
    });

    if(!anyVisible){
      html = currentView === 'history'
        ? `<div class="empty-state"><div class="big">🗂️</div><div>Aucune anomalie archivée pour le moment.</div></div>`
        : `<div class="empty-state"><div class="big">🔍</div><div>Aucune anomalie ne correspond à votre recherche.</div></div>`;
    }
    root.innerHTML = html;
  }

      markTutorialSeen();
      closeModal();
      if(isFirstRun && !profile.name){
        setTimeout(()=> openProfileModal(), 300);

    function renderStep(){
      const s = TUTORIAL_STEPS[step];
      $('#modalRoot').innerHTML = `
        <div class="overlay" id="overlayEl">
          <div class="sheet">
            <div class="sheet-handle"></div>
            <button type="button" class="sheet-close" id="tutoCloseX" aria-label="Fermer">✕</button>

              </div>
            </div>
            <div class="sheet-actions">
              <button type="button" class="btn" id="tutoSkip">${step === 0 ? 'Passer' : 'Précédent'}</button>
              <button type="button" class="btn primary" id="tutoNext">${step === total - 1 ? 'Terminer' : 'Suivant'}</button>
            </div>
          </div>
        </div>
      `;
      $('#overlayEl').addEventListener('click', e=>{ if(e.target.id==='overlayEl') finish(); });
      $('#tutoCloseX').addEventListener('click', finish);
      $('#tutoSkip').addEventListener('click', ()=>{
        if(step === 0) finish();
        else { step--; renderStep(); }
      });
      $('#tutoNext').addEventListener('click', ()=>{
        if(step < total - 1){ step++; renderStep(); }
        else finish();
      });
    }
    renderStep();
  }

        archiveBtn.addEventListener('click', async ()=>{

            ...existing,
            archived: true,
            treatedAt: existing.treatedAt || new Date().toISOString(),
            updatedAt: new Date().toISOString(),

          closeModal();

      const unarchiveBtn = $('#unarchiveBtn');

            ...existing,

            updatedAt: new Date().toISOString(),

          if(ok) haptic(18);
          closeModal();
          showToast(ok ? 'Anomalie sortie de l\u2019historique' : "Échec de la restauration");
        });
      }
    }

    // ---- Photo capture wiring (multi-photos, max MAX_PHOTOS) ----
    let existingPhotos = [];   // [{id, dataUrl}] déjà enregistrées (chargées de manière async)
    let pendingNewPhotos = []; // [dataUrl] fraîchement capturées, pas encore enregistrées
    let removedPhotoIds = [];  // ids des photos existantes à supprimer à l'enregistrement
    let galleryLoading = getPhotoIds(existing || {}).length > 0 && editing;

    function totalPhotoCount(){ return existingPhotos.length + pendingNewPhotos.length; }

    function renderPhotoGallery(){
      const zone = $('#photoGallery');
      let html = '';
      existingPhotos.forEach((p, idx)=>{
        html += `
          <div class="photo-thumb" data-kind="existing" data-idx="${idx}">
            <img src="${p.dataUrl}" alt="Photo ${idx+1}">
            <button type="button" class="remove-photo" data-remove-existing="${idx}">✕</button>
          </div>`;
      });
      pendingNewPhotos.forEach((dataUrl, idx)=>{
        html += `
          <div class="photo-thumb" data-kind="pending" data-idx="${idx}">
            <img src="${dataUrl}" alt="Nouvelle photo ${idx+1}">
            <button type="button" class="remove-photo" data-remove-pending="${idx}">✕</button>
          </div>`;
      });
      if(galleryLoading){
        html += `<div class="photo-thumb loading">Chargement…</div>`;
      }
      zone.innerHTML = html;

      const combined = [...existingPhotos.map(p => p.dataUrl), ...pendingNewPhotos];
      zone.querySelectorAll('.photo-thumb[data-kind] img').forEach((img, i)=>{
        img.addEventListener('click', ()=> openLightbox(combined, i));
      });
      zone.querySelectorAll('[data-remove-existing]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const idx = parseInt(btn.dataset.removeExisting, 10);
          removedPhotoIds.push(existingPhotos[idx].id);
          existingPhotos.splice(idx, 1);
          renderPhotoGallery();
          updatePhotoButtonsState();
        });
      });
      zone.querySelectorAll('[data-remove-pending]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const idx = parseInt(btn.dataset.removePending, 10);
          pendingNewPhotos.splice(idx, 1);
          renderPhotoGallery();
          updatePhotoButtonsState();
        });
      });
    }

    function updatePhotoButtonsState(){
      const full = totalPhotoCount() >= MAX_PHOTOS;
      $('#takePhotoBtn').disabled = full;
      $('#pickPhotoBtn').disabled = full;
    }

    async function handleFile(file){
      if(!file) return;
      if(totalPhotoCount() >= MAX_PHOTOS){
        showToast(`Maximum ${MAX_PHOTOS} photos par anomalie`);
        return;
      }
      galleryLoading = true;
      renderPhotoGallery();
      try{
        let dataUrl = await compressImageFile(file, 1100, 0.7);
        if(dataUrl.length > 700000) dataUrl = await compressImageFile(file, 1100, 0.45);
        if(dataUrl.length > 700000) dataUrl = await compressImageFile(file, 850, 0.4);
        if(dataUrl.length > 900000){
          showToast("Photo trop volumineuse même compressée — réessayez avec une autre photo");
        }else{
          pendingNewPhotos.push(dataUrl);
        }
      }catch(err){
        showToast("Impossible de traiter cette photo");
      }
      galleryLoading = false;
      renderPhotoGallery();
      updatePhotoButtonsState();
    }
    $('#takePhotoBtn').addEventListener('click', ()=> $('#cameraInput').click());
    $('#pickPhotoBtn').addEventListener('click', ()=> $('#galleryInput').click());
    $('#cameraInput').addEventListener('change', e=>{ handleFile(e.target.files[0]); e.target.value=''; });
    $('#galleryInput').addEventListener('change', e=>{ handleFile(e.target.files[0]); e.target.value=''; });

    renderPhotoGallery();
    updatePhotoButtonsState();
    if(editing){
      const ids = getPhotoIds(existing);
      if(ids.length){
        Promise.all(ids.map(id => getPhotoDoc(id).then(dataUrl => ({id, dataUrl})))).then(results=>{
          existingPhotos = results.filter(r => r.dataUrl);
          galleryLoading = false;
          renderPhotoGallery();
          updatePhotoButtonsState();
          const missing = results.length - existingPhotos.length;
          if(missing > 0 && !navigator.onLine){
            showToast(missing === 1
              ? '1 photo non disponible hors connexion'
              : `${missing} photos non disponibles hors connexion`);
          }
        });
      }
    }
    let isSubmitting = false;
    $('#anomalyForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(isSubmitting) return;
      isSubmitting = true;
      const submitBtn = $('#submitBtn');
      if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Enregistrement…'; }
      // Filet de sécurité : le bouton ne doit jamais rester bloqué indéfiniment.
      const unblockTimer = setTimeout(()=>{
        if(submitBtn && submitBtn.isConnected){
          submitBtn.disabled = false;
          submitBtn.textContent = 'Enregistrer';
          isSubmitting = false;
        }
      }, 8000);

      if(!editing){
        const dup = findPotentialDuplicate(catId, $('#f_voie').value, $('#f_equip').value);
        if(dup){
          const proceed = await confirmDialog(
            `Une anomalie similaire existe déjà : ${dup.identifiant} (${dup.statut}). Créer quand même ?`,
            'Créer quand même', 'primary'
          );
          if(!proceed){
            clearTimeout(unblockTimer);
            isSubmitting = false;
            if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'Enregistrer'; }
            return;
          }
        }
      }

      const itemId = editing ? existing.id : uid();
      const nowIso = new Date().toISOString();

      // Supprime les photos retirées, sauvegarde les nouvelles, garde les existantes conservées
      for(const pid of removedPhotoIds){ await deletePhotoDoc(pid); }
      const finalPhotoIds = existingPhotos.map(p => p.id);
      for(const dataUrl of pendingNewPhotos){
        const pid = uid();
        const ok = await savePhotoDoc(pid, dataUrl);
        if(ok) finalPhotoIds.push(pid);
        else showToast("Une photo n'a pas pu être envoyée (trop lourde ?)");
      }

      const newStatut = $('#f_statut').value;
      const wasTraite = editing && existing.statut === 'Traité';
      const payload = {
        voie: $('#f_voie').value.trim(),
        pk: $('#f_pk').value.trim(),
        equipement: $('#f_equip').value.trim(),
        dateConstat: $('#f_date').value,
        priorite: $('#f_prio').value,
        description: $('#f_desc').value.trim(),
        photoIds: finalPhotoIds,
        statut: newStatut,
        dateTraitement: $('#f_datetr').value,
        traitePar: $('#f_par').value.trim(),
        commentaire: $('#f_comment').value.trim(),
        updatedAt: nowIso,
        updatedBy: profile.name || 'Anonyme',
      };
      if(newStatut === 'Traité'){
        // Point de départ du délai de 24 h avant classement automatique.
        payload.treatedAt = (editing && wasTraite && existing.treatedAt) ? existing.treatedAt : nowIso;
      }else{
        payload.treatedAt = null;
        payload.archived = false;
      }
      let finalItem;
      if(editing){
        finalItem = {...existing, ...payload, id: itemId};
        delete finalItem.hasPhoto; // migration : remplacé par photoIds
      }else{
        finalItem = {
          id: itemId,
          category: catId,
          identifiant: nextIdentifiant(catId),
          createdAt: nowIso,
          createdBy: profile.name || 'Anonyme',
          ...payload
        };
      }
      const ok = await saveAnomalyDoc(finalItem);
      clearTimeout(unblockTimer);
      if(ok) haptic(18);
      // Prévenir les collègues, uniquement pour une nouvelle anomalie.
      if(ok && !editing) triggerPushNotification();
      expanded.add(catId);
      closeModal();
      showToast(ok
        ? (navigator.onLine ? 'Anomalie enregistrée' : 'Enregistrée — sera synchronisée au retour du réseau')
        : "Échec de l'enregistrement — réessayez");
    });
  }

  function openLightbox(photos, startIndex){
    if(!photos || !photos.length) return;
    let index = Math.max(0, Math.min(photos.length - 1, startIndex || 0));

    const box = el('div', 'lightbox');
    box.innerHTML = `
      <button type="button" class="lightbox-close" aria-label="Fermer">✕</button>
      <div class="lightbox-track" id="lbTrack">
        ${photos.map(src => `<div class="lightbox-slide"><img src="${src}" draggable="false" alt="Photo agrandie"></div>`).join('')}
      </div>
      ${photos.length > 1 ? `<div class="lightbox-dots">${photos.map((_, i) => `<span class="dot${i === index ? ' active' : ''}"></span>`).join('')}</div>` : ''}
    `;
    document.body.appendChild(box);

    const track = box.querySelector('#lbTrack');
    const slides = Array.from(box.querySelectorAll('.lightbox-slide'));
    const dots = Array.from(box.querySelectorAll('.dot'));
    const zoomState = slides.map(() => ({ scale: 1, x: 0, y: 0 }));

    function setIndex(i, animate){
      index = Math.max(0, Math.min(photos.length - 1, i));
      track.style.transition = animate === false ? 'none' : 'transform 0.25s ease';
      track.style.transform = `translateX(-${index * 100}%)`;
      dots.forEach((d, di) => d.classList.toggle('active', di === index));
    }
    setIndex(index, false);

    function applyZoom(i){
      const img = slides[i].querySelector('img');
      const z = zoomState[i];
      img.style.transform = `translate(${z.x}px, ${z.y}px) scale(${z.scale})`;
    }
    function toggleZoom(i){
      const z = zoomState[i];
      if(z.scale > 1.02){ z.scale = 1; z.x = 0; z.y = 0; }
      else { z.scale = 2.4; }
      applyZoom(i);
    }
    function dist(t1, t2){ return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY); }

    box.querySelector('.lightbox-close').addEventListener('click', ()=> box.remove());

    let mode = null; // 'swipe' | 'pinch' | 'pan'
    let startX = 0, startY = 0, startZX = 0, startZY = 0, startDist = 0, startScale = 1;
    let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

    box.addEventListener('touchstart', (e)=>{
      if(e.touches.length === 2){
        mode = 'pinch';
        startDist = dist(e.touches[0], e.touches[1]);
        startScale = zoomState[index].scale;
      }else if(e.touches.length === 1){
        const t = e.touches[0];
        const now = Date.now();
        if(now - lastTapTime < 300 && Math.abs(t.clientX - lastTapX) < 30 && Math.abs(t.clientY - lastTapY) < 30){
          toggleZoom(index);
          lastTapTime = 0;
          mode = null;
          return;
        }
        lastTapTime = now; lastTapX = t.clientX; lastTapY = t.clientY;
        if(zoomState[index].scale > 1.02){
          mode = 'pan';
          startX = t.clientX; startY = t.clientY;
          startZX = zoomState[index].x; startZY = zoomState[index].y;
        }else{
          mode = 'swipe';
          startX = t.clientX;
        }
      }
    }, {passive:true});

    box.addEventListener('touchmove', (e)=>{
      if(mode === 'pinch' && e.touches.length === 2){
        const d = dist(e.touches[0], e.touches[1]);
        zoomState[index].scale = Math.min(4, Math.max(1, startScale * (d / startDist)));
        applyZoom(index);
      }else if(mode === 'pan' && e.touches.length === 1){
        const t = e.touches[0];
        zoomState[index].x = startZX + (t.clientX - startX);
        zoomState[index].y = startZY + (t.clientY - startY);
        applyZoom(index);
      }else if(mode === 'swipe' && e.touches.length === 1){
        const dx = e.touches[0].clientX - startX;
        track.style.transition = 'none';
        track.style.transform = `translateX(calc(-${index * 100}% + ${dx}px))`;
      }
    }, {passive:true});

    box.addEventListener('touchend', (e)=>{
      if(mode === 'swipe'){
        const dx = e.changedTouches[0].clientX - startX;
        if(dx > 60 && index > 0) setIndex(index - 1);
        else if(dx < -60 && index < photos.length - 1) setIndex(index + 1);
        else setIndex(index);
      }else if(mode === 'pinch' && zoomState[index].scale <= 1.02){
        zoomState[index] = { scale: 1, x: 0, y: 0 };
        applyZoom(index);
      }
      mode = null;
    });
  }

  async function compressImageFile(file, maxDim, quality){
    let source, w, h;
    if('createImageBitmap' in window){
      let bitmap;
      try{ bitmap = await createImageBitmap(file, {imageOrientation:'from-image'}); }
      catch(e){ bitmap = await createImageBitmap(file); }
      source = bitmap; w = bitmap.width; h = bitmap.height;
    }else{
      const img = await loadImageFromFile(file);
      source = img; w = img.naturalWidth; h = img.naturalHeight;
    }
    if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
    else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(source, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', quality);
  }
  function loadImageFromFile(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = e=>{
        const img = new Image();
        img.onload = ()=> resolve(img);
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function showToast(msg, duration, onClick){
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    t.style.cursor = onClick ? 'pointer' : '';
    t.onclick = onClick ? ()=>{ t.hidden = true; clearTimeout(showToast._timer); onClick(); } : null;
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(()=>{ t.hidden = true; }, duration || 2600);
  }

  function exportCSV(){
    const headers = ['Catégorie','Identifiant','Date de constat','Voie','PK','Équipement','Description','Nb photos','Priorité','Statut','Date de traitement','Traité par','Commentaire'];
    const rows = anomalies.map(a=>{
      const catLabel = (CATEGORIES.find(c=>c.id===a.category)||{}).label || a.category;
      return [catLabel,a.identifiant,fmtDate(a.dateConstat),a.voie,a.pk,a.equipement,a.description,getPhotoIds(a).length,a.priorite,a.statut,fmtDate(a.dateTraitement),a.traitePar,a.commentaire]
        .map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',');
    });
    const csv = [headers.join(','), ...rows].join('\r\n');
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `anomalies_terrain_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Export CSV téléchargé');
  }

  // ---------------- Sync (temps réel via Firestore, avec cache hors ligne) ----------------
  function updateSyncStatus(offline, pendingWrites){
    const dot = $('#syncDot');
    const label = $('#syncLabel');
    if(offline){
      dot.classList.remove('live'); dot.classList.add('offline');
      label.textContent = pendingWrites
        ? 'Hors ligne — modifications en attente d\u2019envoi'
        : 'Hors ligne — dernières données connues';
    }else{
      dot.classList.remove('offline'); dot.classList.add('live');
      label.textContent = 'Synchronisé à ' + nowLabel();
    }
  }

  function getLastSeen(){
    try{ return localStorage.getItem('anomalies_last_seen'); }catch(e){ return null; }
  }
  function updateLastSeen(){
    try{ localStorage.setItem('anomalies_last_seen', new Date().toISOString()); }catch(e){ /* ignore */ }
  }

  const notifiedAnomalyIds = new Set();
  // Référence de comparaison, figée pendant toute la session visible.
  // Elle ne doit PAS être réécrite à chaque réception de données : les premières
  // données viennent du cache local (sans les ajouts récents) et écraseraient la
  // référence avant l'arrivée des vraies données du serveur.
  let sessionBaseline = null;

  function goToNewAnomalies(items){
    if(items.length === 1){
      openForm(items[0].category, items[0].id);
    }else{
      currentView = 'home';
      activeFilter = 'new';
      render();
    }
  }
  function checkForNewAnomalies(list){
    if(document.visibilityState !== 'visible') return;
    if(!sessionBaseline){
      // Toute première utilisation : rien à signaler, on pose le repère.
      sessionBaseline = new Date().toISOString();
      updateLastSeen();
      return;
    }
    const newOnes = list.filter(a =>
      a.createdAt && a.createdAt > sessionBaseline &&
      a.createdBy !== profile.name &&
      !notifiedAnomalyIds.has(a.id)
    );
    if(newOnes.length > 0){
      newOnes.forEach(a => { notifiedAnomalyIds.add(a.id); newBatchIds.add(a.id); });
      const count = newOnes.length;
      const msg = count === 1
        ? '📋 1 nouvelle anomalie depuis votre dernière visite — toucher pour l\u2019ouvrir'
        : `📋 ${count} nouvelles anomalies depuis votre dernière visite — toucher pour les voir`;
      renderChips();
      haptic(18);
      showToast(msg, 8000, ()=> goToNewAnomalies(newOnes));
    }
  }

  function startRealtimeSync(){
    // Repère de départ : la dernière fois que cet appareil a consulté l'app.
    sessionBaseline = getLastSeen();

    if(!navigator.onLine) updateSyncStatus(true, false);
    window.addEventListener('offline', ()=> updateSyncStatus(true, false));
    window.addEventListener('online', ()=>{
      updateSyncStatus(false, false);
      setTimeout(prefetchPhotos, 3000);
      flushPendingPush();
    });
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'hidden'){
        // On quitte l'app : on mémorise l'instant, qui servira de repère au retour.
        updateLastSeen();
      }else{
        // Retour à l'écran : on repart du repère posé au moment du départ.
        sessionBaseline = getLastSeen();
        setTimeout(()=> checkForNewAnomalies(anomalies), 200);
      }
    });
    window.addEventListener('pagehide', updateLastSeen);

    onSnapshot(collection(db, ANOMALIES_COL), { includeMetadataChanges: true }, (snapshot)=>{
      anomalies = snapshot.docs.map(d=> ({ id: d.id, ...d.data() }));
      if(!modalOpen) render();
      updateSyncStatus(snapshot.metadata.fromCache, snapshot.metadata.hasPendingWrites);
      checkForNewAnomalies(anomalies);
      // Rend les photos consultables même sans réseau par la suite.
      setTimeout(prefetchPhotos, 2500);
    }, (error)=>{
      console.error(error);
      updateSyncStatus(true, false);
    });
  }

  // ---------------- Event wiring ----------------
  function wireStaticEvents(){
    $('#fab').addEventListener('click', openCategoryPicker);
    $('#menuBtn').addEventListener('click', openMenu);
    $('#historyBtn').addEventListener('click', ()=>{
      currentView = currentView === 'history' ? 'home' : 'history';
      activeFilter = 'all';
      searchTerm = '';
      const si = $('#searchInput');
      if(si) si.value = '';
      expanded.clear();
      window.scrollTo(0, 0);
      render();
    });
    $('#refreshBtn').addEventListener('click', ()=>{
      render();
      showToast(navigator.onLine ? 'Déjà synchronisé en temps réel ✓' : 'Hors ligne — vos modifications sont en attente');
    });
    $('#filterChips').addEventListener('click', e=>{
      const chip = e.target.closest('.chip');
      if(!chip) return;
      if(chip.dataset.filter === 'mine' && !profile.name){
        showToast('Indiquez votre nom pour utiliser ce filtre');
        openProfileModal();
        return;
      }
      // Les nouveautés ont été consultées : on retire le filtre temporaire
      if(activeFilter === 'new' && chip.dataset.filter !== 'new'){
        newBatchIds.clear();
      }
      activeFilter = chip.dataset.filter;
      render();
    });
    $('#searchInput').addEventListener('input', e=>{
      searchTerm = e.target.value;
      render();
    });
    $('#categoryList').addEventListener('click', e=>{
      const addBtn = e.target.closest('.add-anomaly-btn');
      if(addBtn){ openForm(addBtn.dataset.cat); return; }
      const pill = e.target.closest('.status-pill');
      if(pill){
        if(currentView === 'history'){
          const cardEl = pill.closest('.anomaly-card');
          if(cardEl) openForm(cardEl.dataset.cat, cardEl.dataset.id);
          return;
        }
        const cardEl = pill.closest('.anomaly-card');
        if(cardEl) cycleStatus(cardEl.dataset.id);
        return;
      }
      const card = e.target.closest('.anomaly-card');
      if(card){ openForm(card.dataset.cat, card.dataset.id); return; }
      const header = e.target.closest('.category-header');
      if(header){
        const id = header.dataset.cat;
        if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
        render();
      }
    });
    document.addEventListener('keydown', e=>{
      if(e.key==='Escape' && modalOpen) closeModal();
    });
    $('#modalRoot').addEventListener('click', e=>{
      if(e.target.closest('[data-close]')) closeModal();
    });
  }

  let updateReloading = false;
  async function checkForAppUpdate(manual){
    if(updateReloading) return;
    try{
      const res = await fetch('index.html?v=' + Date.now(), { cache: 'no-store' });
      if(!res.ok){
        if(manual) showToast('Vérification impossible (erreur ' + res.status + ')');
        return;
      }
      const text = await res.text();
      const m = text.match(/APP_VERSION\s*=\s*'([^']+)'/);
      if(!m){
        if(manual) showToast('Version en ligne introuvable');
        return;
      }
      if(m[1] === APP_VERSION){
        if(manual) showToast('Vous avez déjà la dernière version (' + APP_VERSION + ')');
        return;
      }

      if(manual){
        showToast('Mise à jour vers ' + m[1] + '…');
        updateReloading = true;
        setTimeout(()=> location.reload(), 600);
        return;
      }

      // Sécurité : on ne recharge automatiquement qu'une seule fois par version.
      // Sans cela, un cache récalcitrant provoquerait des rechargements en boucle.
      let alreadyTried = null;
      try{ alreadyTried = sessionStorage.getItem('anomalies_update_try'); }catch(e){}
      if(alreadyTried === m[1]){
        showToast('Nouvelle version disponible — toucher pour l\u2019installer', 8000, ()=>{
          location.reload();
        });
        return;
      }
      try{ sessionStorage.setItem('anomalies_update_try', m[1]); }catch(e){}
      updateReloading = true;
      location.reload();
    }catch(e){
      if(manual) showToast('Vérification impossible — vérifiez votre connexion');
    }
  }

  function setupAutoUpdate(){
    // Vérification active : compare la version chargée à celle publiée en ligne.
    // C'est ce qui garantit la mise à jour même quand le téléphone réaffiche
    // l'application depuis sa mémoire sans recharger la page.
    setTimeout(()=> checkForAppUpdate(false), 1500);
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible') checkForAppUpdate(false);
    });
    // Filet de sécurité : certains appareils ne signalent pas le retour au premier plan.
    setInterval(()=>{
      if(document.visibilityState === 'visible') checkForAppUpdate(false);
    }, 60000);

    if(!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(updateReloading) return;
      updateReloading = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg)=>{
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState === 'visible') reg.update().catch(()=>{});
      });
    }).catch(()=>{ /* ignore */ });
  }

  function init(){
    window.__appStarted = true;
    wireStaticEvents();
    loadProfile();
    render();
    startRealtimeSync();
    setupAutoUpdate();
    // Une anomalie créée hors ligne lors d'une session précédente peut avoir
    // une notification encore en attente d'envoi.
    flushPendingPush();
    if(!hasSeenTutorial()){
      setTimeout(()=>{ openTutorial(true); }, 400);
    }else if(!profile.name){
      setTimeout(()=>{ openProfileModal(); }, 400);
    }
  }

  init();
})();
